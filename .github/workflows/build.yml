name: Programmer Selection Translator

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ECDICT_COMMIT: bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b
  PLUGIN_ID: plugin.com.elio.programmer-selection-translator

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate plugin identity and source layout
        run: |
          set -euo pipefail
          node <<'NODE'
          const info = require('./info.json');
          const expectedKeys = [
            'outputStyle', 'dictionaryMode', 'identifierType', 'acronymStyle',
            'showNamingConversions', 'showStatusMessages',
            'aiMode', 'apiKeyPool', 'maxKeyAttempts', 'modelPreset', 'customModel', 'sendScope'
          ];
          if (info.id !== 'plugin.com.elio.programmer-selection-translator') throw new Error('unexpected plugin id');
          if (info.plugin_type !== 'translate') throw new Error('unexpected plugin type');
          if (info.icon !== 'icon.svg') throw new Error('unexpected icon');
          if (info.display !== '程序员划词翻译') throw new Error('unexpected display');
          if (info.homepage !== 'https://github.com/elio-zwd/pot-app-translate-plugin-programmer-selection') throw new Error('unexpected homepage');
          const needs = info.needs || [];
          const keys = needs.map((item) => item.key);
          if (JSON.stringify(keys) !== JSON.stringify(expectedKeys)) {
            throw new Error(`unexpected config keys/order: ${keys.join(',')}`);
          }
          if (keys.includes('apiKey') || keys.includes('model') || keys.includes('requestPath')) {
            throw new Error('legacy visible config remains');
          }
          const byKey = Object.fromEntries(needs.map((item) => [item.key, item]));
          const outputStyles = Object.keys((byKey.outputStyle && byKey.outputStyle.options) || {});
          const expectedOutputStyles = [
            'minimal', 'report', 'camel', 'pascal', 'snake',
            'screaming', 'kebab', 'words', 'chinese'
          ];
          if (!byKey.outputStyle || byKey.outputStyle.type !== 'select') {
            throw new Error('outputStyle select is missing');
          }
          if (JSON.stringify(outputStyles) !== JSON.stringify(expectedOutputStyles)) {
            throw new Error(`unexpected outputStyle order: ${outputStyles.join(',')}`);
          }
          if (!byKey.outputStyle.options.minimal.includes('默认')) {
            throw new Error('minimal must be the new default');
          }
          if (byKey.outputStyle.options.report !== '完整分析') {
            throw new Error('report legacy option changed');
          }
          if (byKey.aiMode.type !== 'select' || Object.keys(byKey.aiMode.options)[0] !== 'off') {
            throw new Error('aiMode must default to off');
          }
          if (byKey.showNamingConversions.type !== 'select' || Object.keys(byKey.showNamingConversions.options)[0] !== 'show') {
            throw new Error('showNamingConversions must default to show');
          }
          if (byKey.showStatusMessages.type !== 'select' || Object.keys(byKey.showStatusMessages.options)[0] !== 'show') {
            throw new Error('showStatusMessages must default to show');
          }
          if (byKey.sendScope.type !== 'select' || Object.keys(byKey.sendScope.options)[0] !== 'unknown_tokens') {
            throw new Error('sendScope must default to unknown_tokens');
          }
          if (byKey.apiKeyPool.type !== 'input' || !byKey.apiKeyPool.display.includes('明文')) {
            throw new Error('apiKeyPool plaintext warning is missing');
          }
          const maxAttempts = Object.keys(byKey.maxKeyAttempts.options || {});
          if (JSON.stringify(maxAttempts) !== JSON.stringify(['v5', 'v1', 'v3', 'v10', 'v20'])) {
            throw new Error(`unexpected maxKeyAttempts order: ${maxAttempts.join(',')}`);
          }
          if (byKey.maxKeyAttempts.options.v5 !== '5（默认）') {
            throw new Error('maxKeyAttempts must default to 5');
          }
          const models = Object.keys(byKey.modelPreset.options || {});
          const expectedModels = [
            'gemini-3.5-flash-lite', 'gemini-3.6-flash',
            'gemini-3.5-flash', 'gemini-3.1-flash-lite', 'custom'
          ];
          if (JSON.stringify(models) !== JSON.stringify(expectedModels)) {
            throw new Error(`unexpected model order: ${models.join(',')}`);
          }
          if (byKey.customModel.type !== 'input') throw new Error('customModel input is missing');
          NODE
          test -f src/runtime-01.js
          test -f src/runtime-02-gemini.js
          test -f src/runtime-03-gemini-key-pool.js
          test -f src/runtime-04-gemini-interactions.js
          test -f src/runtime-09-output-style-compat.js
          test -f scripts/build_runtime.py
          test -f scripts/build_dictionary.py
          test -f tests/main.test.cjs
          test -f tests/gemini.test.cjs
          test -f tests/gemini-key-pool.test.cjs
          test -f tests/gemini-interactions.test.cjs
          test -f tests/output-style-compat.test.cjs
          grep -Fq 'node --test tests/*.test.cjs' package.json
          test -f icon.svg
          test -f THIRD_PARTY_NOTICES.md
          test ! -f lingva.svg
          test ! -f dictionary.db
          test ! -f gemini_state.db
          ! grep -R -n -i \
            -E 'plugin\.com\.pot-app\.lingva|lingva\.pot-app\.com|requestPath' \
            src info.json README.md package.json icon.svg THIRD_PARTY_NOTICES.md

      - name: Verify output style compatibility
        run: |
          set -euo pipefail
          node --test tests/output-style-compat.test.cjs
          python scripts/build_runtime.py
          node --test tests/*.test.cjs
          python scripts/test_dictionary_build.py
          git diff --check
          git status --short

      - name: Run JavaScript unit tests
        run: npm test

      - name: Test dictionary builder
        run: python scripts/test_dictionary_build.py

      - name: Download pinned ECDICT source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/ecdict.csv \
            "https://raw.githubusercontent.com/skywind3000/ECDICT/${ECDICT_COMMIT}/ecdict.csv"
          head -n 1 /tmp/ecdict.csv | grep -q '^word,phonetic,definition,translation,'

      - name: Build offline dictionary
        run: |
          set -euo pipefail
          python scripts/build_dictionary.py \
            --input /tmp/ecdict.csv \
            --output dictionary.db \
            --meta dictionary.meta.json \
            --source-commit "${ECDICT_COMMIT}"

      - name: Validate dictionary, license and generated runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          root = Path('.')
          meta = json.loads((root / 'dictionary.meta.json').read_text(encoding='utf-8'))
          assert meta['source_file'] == 'ecdict.csv'
          assert meta['source_commit'] == 'bc015ed2e24a7abef49fc6dbbb7fe32c1dadaf8b'
          assert meta['source_license'] == 'MIT'
          assert meta['explicit_lemmas'] > 0
          assert meta['lemma_links_applied'] > 0

          connection = sqlite3.connect(root / 'dictionary.db')
          entry_count = connection.execute('SELECT COUNT(*) FROM dictionary').fetchone()[0]
          translated_count = connection.execute(
              "SELECT COUNT(*) FROM dictionary WHERE TRIM(translation) <> ''"
          ).fetchone()[0]
          alias_count = connection.execute(
              'SELECT COUNT(*) FROM dictionary WHERE is_alias = 1'
          ).fetchone()[0]
          sample_rows = connection.execute(
              "SELECT word, lemma, translation FROM dictionary ORDER BY word LIMIT 5"
          ).fetchall()
          lemma_samples = dict(connection.execute(
              "SELECT word, lemma FROM dictionary WHERE word IN "
              "('translate', 'translated', 'service', 'services', 'retry', 'retries', 'apple', 'apples')"
          ).fetchall())
          connection.close()

          print({
              'entries': entry_count,
              'translated_entries': translated_count,
              'aliases': alias_count,
              'explicit_lemmas': meta['explicit_lemmas'],
              'generated_lemma_links': meta['generated_lemma_links'],
              'lemma_links_applied': meta['lemma_links_applied'],
              'samples': sample_rows,
              'lemma_samples': lemma_samples,
          })
          assert entry_count == meta['entries'], (entry_count, meta)
          assert entry_count > 100000, meta
          assert translated_count == entry_count
          assert sample_rows and all(row[0] and row[1] and row[2].strip() for row in sample_rows)
          assert lemma_samples['translate'] == 'translate'
          assert lemma_samples['translated'] == 'translate'
          assert lemma_samples['service'] == 'service'
          assert lemma_samples['services'] == 'service'
          assert lemma_samples['retry'] == 'retry'
          assert lemma_samples['retries'] == 'retry'
          assert lemma_samples['apple'] == 'apple'
          assert lemma_samples['apples'] == 'apple'
          PY
          grep -q "${ECDICT_COMMIT}" THIRD_PARTY_NOTICES.md
          test -s main.js
          grep -q 'plugin.com.elio.programmer-selection-translator' main.js
          grep -q "const DEFAULT_GEMINI_MODEL = 'gemini-3.5-flash-lite'" main.js
          grep -q "const MAX_GEMINI_KEYS = 20" main.js
          grep -q "const DEFAULT_MAX_KEY_ATTEMPTS = 5" main.js
          grep -q 'gemini-3.6-flash' main.js
          grep -q 'gemini-3.5-flash' main.js
          grep -q 'gemini-3.1-flash-lite' main.js
          grep -q 'generativelanguage.googleapis.com/v1beta/interactions' main.js
          grep -q "'x-goog-api-key': keyEntry.key" main.js
          grep -q 'response_format' main.js
          grep -q 'store: false' main.js
          ! grep -F ':generateContent' main.js
          ! grep -F 'generativelanguage.googleapis.com/v1beta/models' main.js
          ! grep -F '?key=' main.js
          ! grep -i -E 'lingva|requestPath|plugin\.com\.elio\.code-identifier' main.js
          ! grep -F 'test-gemini-key-not-real' main.js

      - name: Scan for API key leakage
        run: |
          set -euo pipefail
          ! grep -R -n -E 'AIza[0-9A-Za-z_-]{20,}' \
            --exclude-dir=.git --exclude='*.potext' --exclude='dictionary.db' .
          ! grep -R -n -F 'test-gemini-key-not-real' \
            main.js info.json README.md GEMINI-HANDOFF.md THIRD_PARTY_NOTICES.md icon.svg
          test ! -f .env
          test ! -f .env.local
          test ! -f gemini_state.db

      - name: Package Pot plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -j "dist/${PLUGIN_ID}.potext" \
            main.js info.json icon.svg dictionary.db dictionary.meta.json THIRD_PARTY_NOTICES.md
          actual="$(unzip -Z1 "dist/${PLUGIN_ID}.potext" | sort)"
          expected="$(printf '%s\n' THIRD_PARTY_NOTICES.md dictionary.db dictionary.meta.json icon.svg info.json main.js | sort)"
          test "$actual" = "$expected"
          rm -rf /tmp/potext-check
          mkdir -p /tmp/potext-check
          unzip -q "dist/${PLUGIN_ID}.potext" -d /tmp/potext-check
          test ! -e /tmp/potext-check/src
          test ! -e /tmp/potext-check/tests
          test ! -e /tmp/potext-check/scripts
          test ! -e /tmp/potext-check/.env
          test ! -e /tmp/potext-check/gemini_state.db
          test ! -e /tmp/potext-check/lingva.svg
          ! grep -R -n -E 'AIza[0-9A-Za-z_-]{20,}|test-gemini-key-not-real' /tmp/potext-check
          ! grep -R -n -F '?key=' /tmp/potext-check --exclude=dictionary.db
          ! grep -R -n -F ':generateContent' /tmp/potext-check --exclude=dictionary.db
          unzip -l "dist/${PLUGIN_ID}.potext"
          ls -lh "dist/${PLUGIN_ID}.potext"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin.com.elio.programmer-selection-translator.potext
          path: dist/plugin.com.elio.programmer-selection-translator.potext
          if-no-files-found: error
          retention-days: 14
